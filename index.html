<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor de Actores · Keyword</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --negro:#0A0A0A;--negro2:#1A1A1A;--negro3:#2A2A2A;
  --gris1:#F8F8F7;--gris2:#F0EFED;--gris3:#E8E7E4;--gris4:#D0CFC9;--gris5:#9A9890;--gris6:#6B6960;
  --blanco:#FFFFFF;
  --rojo:#C0392B;--rojo-claro:#FEF0EE;--rojo-borde:#F5C0BA;
  --ambar:#B7600A;--ambar-claro:#FEF6EC;--ambar-borde:#F5D5A8;
  --verde:#1A7A3C;--verde-claro:#EDF7F2;--verde-borde:#A8DCC0;
  --naranja:#C96A00;
  --borde:#E8E7E4;--borde2:#D0CFC9;
  --radio:8px;--radio-pill:20px;
  --sombra:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --sombra-lg:0 4px 16px rgba(0,0,0,0.1),0 2px 6px rgba(0,0,0,0.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--gris1);color:var(--negro);min-height:100vh}

/* HEADER */
header{background:var(--negro);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100}
.logo-text{font-size:13px;font-weight:700;color:#fff;letter-spacing:0.05em}
.header-center{font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:0.14em;text-transform:uppercase;font-weight:500}
.header-right{display:flex;align-items:center;gap:12px}
.sel-indicator{font-size:12px;color:rgba(255,255,255,0.5);display:none}
.sel-indicator.visible{display:block}
.sel-indicator span{color:#fff;font-weight:600}
.btn-pdf{background:#fff;color:var(--negro);border:none;border-radius:var(--radio);padding:7px 16px;font-size:12px;font-family:'Inter',sans-serif;font-weight:600;cursor:pointer;display:none;transition:opacity .15s}
.btn-pdf.visible{display:block}
.btn-pdf:hover{opacity:0.88}

/* LAYOUT */
.main{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 56px)}

/* SIDEBAR */
.sidebar{background:var(--blanco);border-right:1px solid var(--borde);padding:1.25rem 1rem;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;overflow-x:visible}
.sidebar::-webkit-scrollbar{width:3px}.sidebar::-webkit-scrollbar-thumb{background:var(--gris3)}
.sidebar-section{margin-bottom:1.25rem}
.sidebar-label{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--gris5);margin-bottom:8px;display:block}
.sidebar-divider{border:none;border-top:1px solid var(--borde);margin:1rem 0}

/* IMPACT CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:4px 11px;border-radius:var(--radio-pill);border:1px solid var(--borde2);background:var(--gris1);color:var(--gris6);cursor:pointer;transition:all .12s;white-space:nowrap;font-family:'Inter',sans-serif}
.chip:hover:not(.disabled){border-color:var(--negro3);color:var(--negro)}
.chip.disabled{opacity:0.28;cursor:default;pointer-events:none}
.chip.on-todos{background:var(--negro);color:#fff;border-color:var(--negro);font-weight:600}
.chip.on-alto{background:var(--rojo-claro);color:var(--rojo);border-color:var(--rojo-borde);font-weight:600}
.chip.on-medio{background:var(--ambar-claro);color:var(--ambar);border-color:var(--ambar-borde);font-weight:600}
.chip.on-bajo{background:var(--verde-claro);color:var(--verde);border-color:var(--verde-borde);font-weight:600}
.chip.on-prio{background:var(--ambar-claro);color:var(--naranja);border-color:var(--ambar-borde);font-weight:600}

/* CUSTOM DROPDOWN */
.dropdown-wrap{position:relative}
.dropdown-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:var(--radio);border:1px solid var(--borde);background:var(--gris1);cursor:pointer;transition:all .12s;user-select:none;font-family:'Inter',sans-serif}
.dropdown-trigger:hover{border-color:var(--borde2)}
.dropdown-trigger.open{border-color:var(--negro);background:var(--blanco)}
.dropdown-trigger.has-value{border-color:var(--negro);background:var(--negro);color:#fff}
.dropdown-trigger.has-value .dropdown-arrow{color:#fff}
.dropdown-label{font-size:12px;color:var(--gris6);font-weight:400;flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dropdown-trigger.has-value .dropdown-label{color:#fff;font-weight:500}
.dropdown-badge{font-size:10px;background:rgba(255,255,255,0.2);color:#fff;border-radius:20px;padding:1px 7px;margin-right:6px;font-weight:600;flex-shrink:0}
.dropdown-arrow{color:var(--gris5);font-size:10px;transition:transform .15s;flex-shrink:0;margin-left:4px}
.dropdown-trigger.open .dropdown-arrow{transform:rotate(180deg)}
.dropdown-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);box-shadow:var(--sombra-lg);z-index:200;overflow:hidden;display:none}
.dropdown-menu.open{display:block}
.dropdown-search{padding:8px;border-bottom:1px solid var(--borde)}
.dropdown-search input{width:100%;font-family:'Inter',sans-serif;font-size:12px;padding:6px 10px;border-radius:6px;border:1px solid var(--borde);background:var(--gris1);color:var(--negro);outline:none}
.dropdown-search input:focus{border-color:var(--negro)}
.dropdown-search input::placeholder{color:var(--gris5)}
.dropdown-list{max-height:200px;overflow-y:auto}
.dropdown-list::-webkit-scrollbar{width:3px}.dropdown-list::-webkit-scrollbar-thumb{background:var(--gris3)}
.dropdown-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;cursor:pointer;transition:background .08s;font-size:12px;color:var(--negro)}
.dropdown-item:hover{background:var(--gris1)}
.dropdown-item.selected{background:var(--gris2);font-weight:500}
.dropdown-item.selected::after{content:'✓';font-size:11px;color:var(--negro);font-weight:700}
.dropdown-item.disabled-item{color:var(--gris4);cursor:default;pointer-events:none}
.dropdown-item .item-count{font-size:10px;color:var(--gris5);background:var(--gris2);border-radius:20px;padding:1px 6px;flex-shrink:0}
.dropdown-all{padding:8px 12px;font-size:12px;color:var(--gris6);cursor:pointer;border-bottom:1px solid var(--borde);transition:background .08s;font-weight:500}
.dropdown-all:hover{background:var(--gris1)}
.dropdown-all.selected{background:var(--negro);color:#fff}
.dropdown-empty{padding:12px;text-align:center;font-size:12px;color:var(--gris5)}

/* DATE FILTERS */
.date-selects{display:flex;flex-direction:column;gap:5px}
.date-select-wrap label{font-size:10px;color:var(--gris5);display:block;margin-bottom:3px;letter-spacing:0.04em;font-weight:500}
.date-select-wrap select{width:100%;font-family:'Inter',sans-serif;font-size:12px;padding:7px 10px;border-radius:var(--radio);border:1px solid var(--borde);background:var(--gris1);color:var(--gris6);cursor:pointer;appearance:none;transition:all .12s}
.date-select-wrap select.activo{background:var(--negro);border-color:var(--negro);color:#fff}
.reset-btn{width:100%;font-size:11px;padding:7px;border-radius:var(--radio);border:1px solid var(--borde);background:transparent;color:var(--gris5);cursor:pointer;font-family:'Inter',sans-serif;margin-top:.75rem;transition:all .12s}
.reset-btn:hover{border-color:var(--negro);color:var(--negro)}

/* CONTENT */
.content{padding:1.5rem 2rem;background:var(--gris1)}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.5rem}
.stat{border-radius:var(--radio);padding:14px 16px;border:1px solid var(--borde);background:var(--blanco);box-shadow:var(--sombra)}
.stat-alto{border-top:2px solid var(--rojo)}
.stat-medio{border-top:2px solid var(--ambar)}
.stat-bajo{border-top:2px solid var(--verde)}
.stat-prio{border-top:2px solid var(--negro)}
.stat-label{font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;color:var(--gris5)}
.stat-num{font-size:26px;font-weight:700;color:var(--negro)}

/* ACTIVE FILTERS */
.active-filters{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:1rem;align-items:center;min-height:0}
.af-label{font-size:11px;color:var(--gris5)}
.af-tag{font-size:11px;padding:3px 10px;border-radius:var(--radio-pill);background:var(--negro);border:1px solid var(--negro);color:#fff;display:flex;align-items:center;gap:5px}
.af-tag button{background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.5);font-size:14px;line-height:1;padding:0}
.af-tag button:hover{color:#fff}
.af-clear{font-size:11px;color:var(--gris5);cursor:pointer;text-decoration:underline}
.af-clear:hover{color:var(--negro)}

/* RESULTS */
.results-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.results-count{font-size:12px;color:var(--gris5)}
.results-count strong{color:var(--negro);font-weight:600}

/* NEWS CARDS */
.news-card{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);padding:1rem 1.25rem;margin-bottom:8px;cursor:pointer;transition:all .12s;box-shadow:var(--sombra)}
.news-card:hover{border-color:var(--borde2);box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.news-card.selected{border-color:var(--negro);box-shadow:0 0 0 1px var(--negro)}
.news-card.prioritario{border-left:3px solid var(--naranja)}
.card-top{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.card-chk{width:16px;height:16px;border:1.5px solid var(--gris4);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:all .12s}
.card-chk.on{background:var(--negro);border-color:var(--negro)}
.card-chk.on::after{content:'';width:8px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block}
.card-header{flex:1}
.card-title{font-size:14px;font-weight:600;color:var(--negro);line-height:1.4;margin-bottom:4px}
.card-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.card-date,.card-fuente{font-size:11px;color:var(--gris5)}
.card-sep{font-size:11px;color:var(--gris4)}
.prio-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:var(--radio-pill);background:var(--ambar-claro);color:var(--naranja);border:1px solid var(--ambar-borde);flex-shrink:0;letter-spacing:0.04em;text-transform:uppercase}
.card-desc{font-size:13px;color:var(--gris6);line-height:1.65;padding-left:26px;margin-bottom:10px}
.card-badges{display:flex;gap:5px;flex-wrap:wrap;padding-left:26px}
.badge{font-size:11px;padding:3px 9px;border-radius:var(--radio-pill);font-weight:500;display:inline-block;white-space:nowrap}
.b-alto{background:var(--rojo-claro);color:var(--rojo);border:1px solid var(--rojo-borde)}
.b-medio{background:var(--ambar-claro);color:var(--ambar);border:1px solid var(--ambar-borde)}
.b-bajo{background:var(--verde-claro);color:var(--verde);border:1px solid var(--verde-borde)}
.b-tag{background:var(--gris2);color:var(--gris6);border:1px solid var(--borde)}

.loading,.empty{text-align:center;padding:4rem 2rem;color:var(--gris5);font-size:14px}
.spinner{width:28px;height:28px;border:1.5px solid var(--gris3);border-top-color:var(--negro);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);padding:2rem;width:100%;max-width:440px;box-shadow:var(--sombra-lg)}
.modal h3{font-size:18px;font-weight:700;color:var(--negro);margin-bottom:4px}
.modal p{font-size:13px;color:var(--gris6);margin-bottom:1.25rem}
.modal-field{margin-bottom:12px}
.modal-field label{display:block;font-size:10px;color:var(--gris5);margin-bottom:5px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600}
.modal-field input{width:100%;font-family:'Inter',sans-serif;font-size:13px;padding:9px 12px;border-radius:var(--radio);border:1px solid var(--borde);background:var(--gris1);color:var(--negro)}
.modal-field input:focus{outline:none;border-color:var(--negro)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem}
.btn-cancel{font-size:13px;padding:8px 16px;border-radius:var(--radio);border:1px solid var(--borde);background:transparent;cursor:pointer;color:var(--gris6);font-family:'Inter',sans-serif}
.btn-cancel:hover{border-color:var(--negro);color:var(--negro)}
.btn-generar{font-size:13px;padding:8px 20px;border-radius:var(--radio);border:none;background:var(--negro);color:#fff;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600}
.btn-generar:hover{opacity:0.85}.btn-generar:disabled{opacity:.35;cursor:not-allowed}
.modal-status{font-size:12px;color:var(--gris5);margin-top:8px;min-height:18px}

.notif{position:fixed;bottom:1.5rem;right:1.5rem;font-size:12px;padding:10px 16px;border-radius:var(--radio);z-index:400;display:none;box-shadow:var(--sombra-lg)}
.notif.ok{background:var(--verde-claro);color:var(--verde);border:1px solid var(--verde-borde);display:block}
.notif.err{background:var(--rojo-claro);color:var(--rojo);border:1px solid var(--rojo-borde);display:block}

@media(max-width:768px){.main{grid-template-columns:1fr}.sidebar{position:relative;top:0;height:auto}.stats{grid-template-columns:repeat(2,1fr)}.content{padding:1rem}}
</style>
</head>
<body>
<header>
  <span class="logo-text">Keyword</span>
  <span class="header-center">Monitor de Actores</span>
  <div class="header-right">
    <p class="sel-indicator" id="selIndicator"><span id="selNum">0</span> seleccionadas</p>
    <button class="btn-pdf" id="btnPdf" onclick="abrirModal()">Generar PDF</button>
  </div>
</header>

<div class="main">
  <aside class="sidebar">
    <!-- FECHA -->
    <div class="sidebar-section">
      <span class="sidebar-label">Fecha</span>
      <div class="date-selects">
        <div class="date-select-wrap"><label>Año</label><select id="fAnio" onchange="setFecha('anio',this.value)"><option value="all">Todos</option></select></div>
        <div class="date-select-wrap"><label>Mes</label><select id="fMes" onchange="setFecha('mes',this.value)"><option value="all">Todos</option></select></div>
        <div class="date-select-wrap"><label>Día</label><select id="fDia" onchange="setFecha('dia',this.value)"><option value="all">Todos</option></select></div>
      </div>
    </div>
    <hr class="sidebar-divider">
    <!-- IMPACTO chips -->
    <div class="sidebar-section">
      <span class="sidebar-label">Impacto</span>
      <div class="chips" id="chips-impacto"></div>
    </div>
    <!-- SECTOR dropdown -->
    <div class="sidebar-section">
      <span class="sidebar-label">Sector</span>
      <div class="dropdown-wrap" id="wrap-sector">
        <div class="dropdown-trigger" id="trigger-sector" onclick="toggleDropdown('sector')">
          <span class="dropdown-label" id="label-sector">Todos los sectores</span>
          <span class="dropdown-arrow">▼</span>
        </div>
        <div class="dropdown-menu" id="menu-sector">
          <div class="dropdown-search"><input type="text" placeholder="Buscar sector..." id="search-sector" oninput="filterDropdown('sector')" onclick="event.stopPropagation()"></div>
          <div class="dropdown-all" id="all-sector" onclick="selectDropdown('sector','all')">Todos los sectores</div>
          <div class="dropdown-list" id="list-sector"></div>
        </div>
      </div>
    </div>
    <!-- FACTOR dropdown -->
    <div class="sidebar-section">
      <span class="sidebar-label">Tipo de factor</span>
      <div class="dropdown-wrap" id="wrap-factor">
        <div class="dropdown-trigger" id="trigger-factor" onclick="toggleDropdown('factor')">
          <span class="dropdown-label" id="label-factor">Todos los factores</span>
          <span class="dropdown-arrow">▼</span>
        </div>
        <div class="dropdown-menu" id="menu-factor">
          <div class="dropdown-search"><input type="text" placeholder="Buscar factor..." id="search-factor" oninput="filterDropdown('factor')" onclick="event.stopPropagation()"></div>
          <div class="dropdown-all" id="all-factor" onclick="selectDropdown('factor','all')">Todos los factores</div>
          <div class="dropdown-list" id="list-factor"></div>
        </div>
      </div>
    </div>
    <hr class="sidebar-divider">
    <div class="sidebar-section">
      <div class="chips"><span class="chip" id="chip-prio" onclick="togglePrio()">Solo prioritarias</span></div>
    </div>
    <button class="reset-btn" onclick="resetFiltros()">Limpiar todos los filtros</button>
  </aside>

  <div class="content">
    <div class="stats" id="statsBar"></div>
    <div class="active-filters" id="activeFilters"></div>
    <div class="results-bar"><p class="results-count" id="resultsCount"></p></div>
    <div id="newsGrid"><div class="loading"><div class="spinner"></div>Cargando noticias...</div></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>Generar reporte</h3>
    <p id="modalDesc">Se incluirán las noticias seleccionadas.</p>
    <div class="modal-field"><label>Título del reporte</label><input type="text" id="pdfTitulo" value="Reporte de actores de mayor impacto"></div>
    <div class="modal-field"><label>Preparado por</label><input type="text" id="pdfAutor" placeholder="Nombre o área..."></div>
    <div class="modal-status" id="modalStatus"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-generar" id="btnGenerar" onclick="generarPDF()">Generar PDF</button>
    </div>
  </div>
</div>
<div class="notif" id="notif"></div>

<script>
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// ─── Endpoint de la función ───────────────────────────────────────────────────
const API_ENDPOINT = '/api/notion';
// ────────────────────────────────────────────────────────────────────────────

// Opciones leídas dinámicamente de Notion (se cargan al iniciar)
let SECTORES = [];
let FACTORES = [];

let noticias = [], selected = new Set();
let filtros = {impacto:'all', sector:'all', factor:'all', prio:false, anio:'all', mes:'all', dia:'all'};
let openDropdown = null;

// Cierra dropdowns al hacer click fuera
document.addEventListener('click', e => {
  if(openDropdown && !document.getElementById('wrap-'+openDropdown).contains(e.target)){
    closeDropdown(openDropdown);
  }
});

function toggleDropdown(name){
  if(openDropdown && openDropdown !== name) closeDropdown(openDropdown);
  const menu = document.getElementById('menu-'+name);
  const trigger = document.getElementById('trigger-'+name);
  const isOpen = menu.classList.contains('open');
  if(isOpen){ closeDropdown(name); }
  else{
    menu.classList.add('open');
    trigger.classList.add('open');
    openDropdown = name;
    const search = document.getElementById('search-'+name);
    if(search){ search.value=''; search.focus(); filterDropdown(name); }
  }
}

function closeDropdown(name){
  document.getElementById('menu-'+name).classList.remove('open');
  document.getElementById('trigger-'+name).classList.remove('open');
  if(openDropdown === name) openDropdown = null;
}

function selectDropdown(name, val){
  filtros[name] = val;
  closeDropdown(name);
  renderTodo();
}

function filterDropdown(name){
  const q = document.getElementById('search-'+name).value.toLowerCase();
  const items = document.getElementById('list-'+name).querySelectorAll('.dropdown-item');
  items.forEach(el => {
    el.style.display = el.dataset.val.toLowerCase().includes(q) ? '' : 'none';
  });
}

async function cargarNoticias(){
  document.getElementById('newsGrid').innerHTML = '<div class="loading"><div class="spinner"></div>Cargando noticias...</div>';
  try{
    const res = await fetch(API_ENDPOINT);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    // Soporte para dos formatos de respuesta:
    // 1. Array directo de noticias: [{titulo, desc, ...}, ...]
    // 2. Objeto con noticias + opciones: {items: [...], sectores: [...], factores: [...]}
    if(Array.isArray(data)){
      noticias = data;
    } else {
      noticias = data.items || data.noticias || [];
      if(data.sectores && data.sectores.length) SECTORES = data.sectores;
      if(data.factores && data.factores.length) FACTORES = data.factores;
    }

    // Si los arrays siguen vacíos, infiere las opciones desde los datos
    if(!SECTORES.length){
      SECTORES = [...new Set(noticias.map(n => n.sector).filter(Boolean))].sort();
    }
    if(!FACTORES.length){
      FACTORES = [...new Set(noticias.map(n => n.factor).filter(Boolean))].sort();
    }

    renderTodo();
  } catch(e){
    document.getElementById('newsGrid').innerHTML = '<div class="empty">No se pudo conectar con Notion.<br>Intenta recargar la página.</div>';
    console.error(e);
  }
}

function fechaStr(n){ if(!n.dia) return 'Sin fecha'; return n.dia+' '+MESES[n.mes-1]+' '+n.anio; }
function fechaISO(n){ return n.anio ? n.anio*10000+n.mes*100+n.dia : 0; }
function setFiltro(k,v){ filtros[k]=v; renderTodo(); }
function setFecha(k,v){ filtros[k]=v==='all'?'all':parseInt(v); if(k==='anio'){filtros.mes='all';filtros.dia='all';} if(k==='mes'){filtros.dia='all';} renderTodo(); }
function togglePrio(){ filtros.prio=!filtros.prio; renderTodo(); }
function resetFiltros(){ filtros={impacto:'all',sector:'all',factor:'all',prio:false,anio:'all',mes:'all',dia:'all'}; renderTodo(); }

function filtradas(){
  return noticias.filter(n=>{
    if(filtros.anio!=='all' && n.anio!=filtros.anio) return false;
    if(filtros.mes!=='all' && n.mes!=filtros.mes) return false;
    if(filtros.dia!=='all' && n.dia!=filtros.dia) return false;
    if(filtros.impacto!=='all' && n.impacto!==filtros.impacto) return false;
    if(filtros.sector!=='all' && n.sector!==filtros.sector) return false;
    if(filtros.factor!=='all' && n.factor!==filtros.factor) return false;
    if(filtros.prio && !n.prioritario) return false;
    return true;
  }).sort((a,b)=>fechaISO(b)-fechaISO(a));
}

function disponibles(campo){
  const counts = {};
  noticias.filter(n=>{
    if(campo!=='anio' && filtros.anio!=='all' && n.anio!=filtros.anio) return false;
    if(campo!=='mes' && filtros.mes!=='all' && n.mes!=filtros.mes) return false;
    if(campo!=='dia' && filtros.dia!=='all' && n.dia!=filtros.dia) return false;
    if(campo!=='impacto' && filtros.impacto!=='all' && n.impacto!==filtros.impacto) return false;
    if(campo!=='sector' && filtros.sector!=='all' && n.sector!==filtros.sector) return false;
    if(campo!=='factor' && filtros.factor!=='all' && n.factor!==filtros.factor) return false;
    if(campo!=='prio' && filtros.prio && !n.prioritario) return false;
    return true;
  }).forEach(n=>{ if(n[campo]) counts[n[campo]]=(counts[n[campo]]||0)+1; });
  return counts;
}

function renderTodo(){ renderStats(); renderDateFilters(); renderImpactoChips(); renderDropdown('sector',SECTORES); renderDropdown('factor',FACTORES); renderActiveFilters(); renderCards(); renderHeader(); }

function renderStats(){
  const alto = noticias.filter(n=>n.impacto==='Alto').length;
  const medio = noticias.filter(n=>n.impacto==='Medio').length;
  const bajo = noticias.filter(n=>n.impacto==='Bajo').length;
  const prios = noticias.filter(n=>n.prioritario).length;
  document.getElementById('statsBar').innerHTML =
    '<div class="stat stat-alto"><div class="stat-label">Alto impacto</div><div class="stat-num">'+alto+'</div></div>'+
    '<div class="stat stat-medio"><div class="stat-label">Medio impacto</div><div class="stat-num">'+medio+'</div></div>'+
    '<div class="stat stat-bajo"><div class="stat-label">Bajo impacto</div><div class="stat-num">'+bajo+'</div></div>'+
    '<div class="stat stat-prio"><div class="stat-label">Prioritarias</div><div class="stat-num">'+prios+'</div></div>';
}

function renderDateFilters(){
  const anios = [...new Set(noticias.filter(n=>n.anio).map(n=>n.anio))].sort((a,b)=>b-a);
  const mesesDisp = filtros.anio==='all'
    ? [...new Set(noticias.filter(n=>n.mes).map(n=>n.mes))].sort((a,b)=>a-b)
    : [...new Set(noticias.filter(n=>n.anio==filtros.anio&&n.mes).map(n=>n.mes))].sort((a,b)=>a-b);
  const diasDisp = (()=>{
    let s = noticias.filter(n=>n.dia);
    if(filtros.anio!=='all') s=s.filter(n=>n.anio==filtros.anio);
    if(filtros.mes!=='all') s=s.filter(n=>n.mes==filtros.mes);
    return [...new Set(s.map(n=>n.dia))].sort((a,b)=>a-b);
  })();
  document.getElementById('fAnio').innerHTML = '<option value="all">Todos</option>'+anios.map(a=>'<option value="'+a+'"'+(filtros.anio==a?' selected':'')+'>'+a+'</option>').join('');
  document.getElementById('fMes').innerHTML = '<option value="all">Todos</option>'+mesesDisp.map(m=>'<option value="'+m+'"'+(filtros.mes==m?' selected':'')+'>'+MESES[m-1]+'</option>').join('');
  document.getElementById('fDia').innerHTML = '<option value="all">Todos</option>'+diasDisp.map(d=>'<option value="'+d+'"'+(filtros.dia==d?' selected':'')+'>'+d+'</option>').join('');
  document.getElementById('fAnio').className = filtros.anio!=='all'?'activo':'';
  document.getElementById('fMes').className = filtros.mes!=='all'?'activo':'';
  document.getElementById('fDia').className = filtros.dia!=='all'?'activo':'';
}

function renderImpactoChips(){
  const disp = disponibles('impacto');
  const impactos = ['Alto','Medio','Bajo'];
  document.getElementById('chips-impacto').innerHTML =
    '<span class="chip '+(filtros.impacto==='all'?'on-todos':'')+'" onclick="setFiltro(\'impacto\',\'all\')">Todos</span>'+
    impactos.map(v=>{
      const a=filtros.impacto===v, d=disp[v]||a;
      return '<span class="chip '+(a?'on-'+v.toLowerCase():d?'':'disabled')+'"'+(d||a?' onclick="setFiltro(\'impacto\',\''+v+'\')"':'')+'>'+v+(d&&!a?' <span style="font-size:10px;opacity:.6">('+disp[v]+')</span>':'')+'</span>';
    }).join('');
  document.getElementById('chip-prio').className = 'chip '+(filtros.prio?'on-prio':'');
}

function renderDropdown(name, opciones){
  const counts = disponibles(name);
  const selected_val = filtros[name];
  const trigger = document.getElementById('trigger-'+name);
  const label = document.getElementById('label-'+name);
  const allEl = document.getElementById('all-'+name);
  const list = document.getElementById('list-'+name);

  if(selected_val !== 'all'){
    trigger.classList.add('has-value');
    label.innerHTML = '<span class="dropdown-badge">1</span>'+selected_val;
  } else {
    trigger.classList.remove('has-value');
    label.textContent = name==='sector' ? 'Todos los sectores' : 'Todos los factores';
  }

  allEl.className = 'dropdown-all'+(selected_val==='all'?' selected':'');

  list.innerHTML = opciones.map(op=>{
    const count = counts[op]||0;
    const isSel = selected_val===op;
    const isDis = count===0 && !isSel;
    return '<div class="dropdown-item'+(isSel?' selected':'')+(isDis?' disabled-item':'')+'" data-val="'+op+'" onclick="selectDropdown(\''+name+'\',\''+op.replace(/'/g,"\\'")+'\')">'+
      '<span>'+op+'</span>'+
      (count>0&&!isSel?'<span class="item-count">'+count+'</span>':'')+
    '</div>';
  }).join('');
}

function renderActiveFilters(){
  const tags = [];
  if(filtros.anio!=='all') tags.push({label:'Año: '+filtros.anio, clear:()=>{filtros.anio='all';filtros.mes='all';filtros.dia='all';renderTodo();}});
  if(filtros.mes!=='all') tags.push({label:'Mes: '+MESES[filtros.mes-1], clear:()=>{filtros.mes='all';filtros.dia='all';renderTodo();}});
  if(filtros.dia!=='all') tags.push({label:'Día: '+filtros.dia, clear:()=>{filtros.dia='all';renderTodo();}});
  if(filtros.impacto!=='all') tags.push({label:'Impacto: '+filtros.impacto, clear:()=>{filtros.impacto='all';renderTodo();}});
  if(filtros.sector!=='all') tags.push({label:'Sector: '+filtros.sector, clear:()=>{filtros.sector='all';renderTodo();}});
  if(filtros.factor!=='all') tags.push({label:'Factor: '+filtros.factor, clear:()=>{filtros.factor='all';renderTodo();}});
  if(filtros.prio) tags.push({label:'Prioritarias', clear:()=>{filtros.prio=false;renderTodo();}});
  window._afTags = tags;
  const af = document.getElementById('activeFilters');
  if(tags.length){
    af.innerHTML = '<span class="af-label">Activos:</span>'+
      tags.map((t,i)=>'<span class="af-tag">'+t.label+'<button onclick="clearTag('+i+')">×</button></span>').join('')+
      '<span class="af-clear" onclick="resetFiltros()">Limpiar todo</span>';
  } else { af.innerHTML=''; }
}

function clearTag(i){ if(window._afTags&&window._afTags[i]) window._afTags[i].clear(); }

function renderCards(){
  const vis = filtradas();
  document.getElementById('resultsCount').innerHTML = 'Mostrando <strong>'+vis.length+'</strong> de <strong>'+noticias.length+'</strong> registros';
  document.getElementById('newsGrid').innerHTML = vis.length ? vis.map(n=>
    '<div class="news-card'+(selected.has(n.id)?' selected':'')+(n.prioritario?' prioritario':'')+'" onclick="toggleSel(\''+n.id+'\')">'+
    '<div class="card-top"><div class="card-chk'+(selected.has(n.id)?' on':'')+'"></div>'+
    '<div class="card-header"><p class="card-title">'+n.titulo+'</p>'+
    '<div class="card-meta"><span class="card-date">'+fechaStr(n)+'</span><span class="card-sep">·</span><span class="card-fuente">'+(n.fuente||'')+'</span></div></div>'+
    (n.prioritario?'<span class="prio-badge">Prioritario</span>':'')+
    '</div><p class="card-desc">'+n.desc+'</p>'+
    '<div class="card-badges">'+impactoBadge(n.impacto)+(n.sector?'<span class="badge b-tag">'+n.sector+'</span>':'')+(n.factor?'<span class="badge b-tag">'+n.factor+'</span>':'')+
    '</div></div>'
  ).join('') : '<div class="empty">No hay registros con los filtros seleccionados.</div>';
}

function renderHeader(){
  document.getElementById('selNum').textContent = selected.size;
  document.getElementById('selIndicator').classList.toggle('visible', selected.size>0);
  document.getElementById('btnPdf').classList.toggle('visible', selected.size>0);
}

function impactoBadge(v){ const m={Alto:'b-alto',Medio:'b-medio',Bajo:'b-bajo'}; return '<span class="badge '+(m[v]||'b-tag')+'">'+(v||'')+'</span>'; }
function toggleSel(id){ if(selected.has(id)) selected.delete(id); else selected.add(id); renderCards(); renderHeader(); }
function abrirModal(){ document.getElementById('modalDesc').textContent='Se incluirán '+selected.size+' registro'+(selected.size!==1?'s':'')+' en el reporte.'; document.getElementById('modalStatus').textContent=''; document.getElementById('btnGenerar').disabled=false; document.getElementById('modalOverlay').classList.add('open'); }
function cerrarModal(){ document.getElementById('modalOverlay').classList.remove('open'); }

function impactoColorPDF(v){
  if(v==='Alto') return {bg:'#FEF0EE',color:'#C0392B',border:'#F5C0BA'};
  if(v==='Medio') return {bg:'#FEF6EC',color:'#B7600A',border:'#F5D5A8'};
  return {bg:'#EDF7F2',color:'#1A7A3C',border:'#A8DCC0'};
}

function generarPDF(){
  const titulo = document.getElementById('pdfTitulo').value || 'Reporte de actores de mayor impacto';
  const autor = document.getElementById('pdfAutor').value || 'Equipo editorial';
  const sels = noticias.filter(n=>selected.has(n.id));
  const hoy = new Date().toLocaleDateString('es-EC',{year:'numeric',month:'long',day:'numeric'});
  const cI={Alto:0,Medio:0,Bajo:0}; const cS={};
  sels.forEach(n=>{ if(n.impacto) cI[n.impacto]=(cI[n.impacto]||0)+1; if(n.sector) cS[n.sector]=(cS[n.sector]||0)+1; });
  const filasI = Object.entries(cI).filter(([,v])=>v>0).map(([k,v])=>{ const c=impactoColorPDF(k); return '<tr><td style="padding:6px 14px"><span style="background:'+c.bg+';color:'+c.color+';border:1px solid '+c.border+';padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600">'+k+'</span></td><td style="padding:6px 14px;font-weight:700;text-align:center;color:#0A0A0A">'+v+'</td></tr>'; }).join('');
  const filasS = Object.entries(cS).map(([k,v])=>'<tr><td style="padding:5px 14px;color:#6B6960;font-size:12px">'+k+'</td><td style="padding:5px 14px;font-weight:600;text-align:center;font-size:12px;color:#0A0A0A">'+v+'</td></tr>').join('');
  const noticiasHTML = sels.map(n=>{ const c=impactoColorPDF(n.impacto); return '<div style="margin-bottom:20px;padding:20px;background:#FAFAF9;border-radius:8px;border:1px solid #E8E7E4;border-left:'+(n.prioritario?'3px solid #C96A00':'3px solid #E8E7E4')+'"><div style="margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:11px;color:#9A9890">'+fechaStr(n)+(n.fuente?' · '+n.fuente:'')+'</span>'+(n.prioritario?'<span style="background:#FEF6EC;color:#C96A00;border:1px solid #F5D5A8;padding:1px 8px;border-radius:20px;font-size:10px;font-weight:600;text-transform:uppercase">Prioritario</span>':'')+'</div><p style="font-size:15px;font-weight:700;color:#0A0A0A;margin-bottom:10px;line-height:1.4">'+n.titulo+'</p><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"><span style="background:'+c.bg+';color:'+c.color+';border:1px solid '+c.border+';padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600">'+n.impacto+'</span>'+(n.sector?'<span style="background:#F0EFED;color:#6B6960;border:1px solid #E8E7E4;padding:2px 10px;border-radius:20px;font-size:11px">'+n.sector+'</span>':'')+(n.factor?'<span style="background:#F0EFED;color:#6B6960;border:1px solid #E8E7E4;padding:2px 10px;border-radius:20px;font-size:11px">'+n.factor+'</span>':'')+'</div><p style="font-size:13px;color:#6B6960;line-height:1.7">'+n.desc+'</p></div>'; }).join('');
  const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+titulo+'</title><style>body{margin:0;padding:0;background:#fff;font-family:Inter,Arial,sans-serif;color:#0A0A0A}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><div style="max-width:820px;margin:0 auto"><div style="background:#0A0A0A;padding:28px 40px"><p style="font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:6px">Monitor de Actores · Keyword</p><h1 style="font-size:22px;font-weight:700;color:#fff;margin-bottom:4px">'+titulo+'</h1><p style="font-size:12px;color:rgba(255,255,255,.4)">'+hoy+' · '+autor+'</p></div><div style="padding:32px 40px;background:#fff"><div style="display:flex;gap:20px;margin-bottom:32px;flex-wrap:wrap"><div style="flex:1;min-width:180px"><p style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9A9890;margin-bottom:8px;font-weight:600">Por impacto</p><table style="width:100%;border-collapse:collapse;border:1px solid #E8E7E4"><tbody>'+filasI+'</tbody></table></div><div style="flex:2;min-width:260px"><p style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9A9890;margin-bottom:8px;font-weight:600">Por sector</p><table style="width:100%;border-collapse:collapse;border:1px solid #E8E7E4"><tbody>'+filasS+'</tbody></table></div></div><p style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9A9890;margin-bottom:16px;border-top:1px solid #E8E7E4;padding-top:24px;font-weight:600">Registros seleccionados</p>'+noticiasHTML+'<div style="border-top:1px solid #E8E7E4;padding-top:16px;margin-top:8px;text-align:center"><p style="font-size:11px;color:#D0CFC9">Documento confidencial · Keyword · '+hoy+'</p></div></div></div></body></html>';
  cerrarModal(); showNotif('Reporte generado','ok'); selected.clear(); renderCards(); renderHeader();
  const w = window.open('','_blank'); if(w){ w.document.write(html); w.document.close(); setTimeout(()=>w.print(),600); }
}

function showNotif(msg,tipo){ const el=document.getElementById('notif'); el.textContent=msg; el.className='notif '+tipo; setTimeout(()=>{ el.className='notif'; },3500); }

cargarNoticias();
</script>
</body>
